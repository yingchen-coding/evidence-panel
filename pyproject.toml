[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-panel"
version = "0.1.0"
description = "An evidence-grounded, budget-bounded multi-agent research-ideation engine: rank an author cohort into paper-method lenses, cross-review them, and emit falsifiable proposed experiments."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["research", "ideation", "multi-agent", "ai-safety", "evaluation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
